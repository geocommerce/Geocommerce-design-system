<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="120/220/420ms on a single standard ease; no bounce" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 26px;background:var(--surface-page)}@keyframes slide{0%,12%{transform:translateX(0)}55%,100%{transform:translateX(240px)}}.t{height:34px;width:34px;border-radius:999px;background:var(--green-600)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">fast 120ms</div><div class="t" style="animation:slide 1.6s cubic-bezier(.22,.61,.36,1) infinite alternate"></div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">base 220ms</div><div class="t" style="animation:slide 2s cubic-bezier(.22,.61,.36,1) infinite alternate"></div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:120px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">slow 420ms</div><div class="t" style="animation:slide 2.6s cubic-bezier(.16,.84,.44,1) infinite alternate"></div></div>
</div>
</body></html>
