<!-- @dsCard group="Colors" viewport="700x200" name="Surface pairings" subtitle="The four legal background/foreground combinations" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 26px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="padding:18px;border-radius:var(--radius-md);background:var(--shell-000);box-shadow:var(--inset-hairline)"><div style="font:var(--text-h6);color:var(--text-heading)">Page</div><p style="margin:6px 0 0;font:var(--text-small);color:var(--text-muted)">shell-000 + ink</p></div>
<div style="padding:18px;border-radius:var(--radius-md);background:var(--ink-000);box-shadow:var(--shadow-sm)"><div style="font:var(--text-h6);color:var(--text-heading)">Card</div><p style="margin:6px 0 0;font:var(--text-small);color:var(--text-muted)">white + ink</p></div>
<div style="padding:18px;border-radius:var(--radius-md);background:var(--green-900)"><div style="font:var(--text-h6);color:var(--shell-000)">Inverse</div><p style="margin:6px 0 0;font:var(--text-small);color:rgba(247,247,242,.7)">green-900 + shell</p></div>
<div style="padding:18px;border-radius:var(--radius-md);background:var(--green-600)"><div style="font:var(--text-h6);color:var(--shell-000)">Brand</div><p style="margin:6px 0 0;font:var(--text-small);color:rgba(247,247,242,.82)">green-600 + shell</p></div>
</div>
</body></html>
