<!-- @dsCard group="Type" viewport="700x170" name="Weights in use" subtitle="Jost 300/500 for display, Poppins 400/500/600 for text" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 26px;background:var(--surface-page)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;align-items:baseline">
<div style="font-family:var(--font-display);font-weight:300;font-size:28px;color:var(--text-heading)">Jost Light 300</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">pull quotes, large numerals</div>
<div style="font-family:var(--font-display);font-weight:500;font-size:28px;color:var(--text-heading)">Jost Medium 500</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">all headings, wordmark</div>
<div style="font-family:var(--font-body);font-weight:400;font-size:20px;color:var(--text-heading)">Poppins Regular 400</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">body copy</div>
<div style="font-family:var(--font-body);font-weight:500;font-size:20px;color:var(--text-heading)">Poppins Medium 500</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">buttons, labels, eyebrows</div>
<div style="font-family:var(--font-body);font-weight:600;font-size:20px;color:var(--text-heading)">Poppins SemiBold 600</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">h5 / h6 subheads</div>
</div>
</body></html>
